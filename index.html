<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIRTHDAY BOY</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#141414;
    overflow:hidden;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* Background glow */
body::before{
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(circle,#b30000 0%,#141414 70%);
    opacity:.8;
}

/* Floating hearts */
.heart{
    position:absolute;
    color:white;
    opacity:.15;
    animation:float 10s linear infinite;
}

@keyframes float{
    from{
        transform:translateY(110vh);
    }
    to{
        transform:translateY(-120vh);
    }
}

.card{
    width:1000px;
    height:560px;
    display:flex;
    border-radius:20px;
    overflow:hidden;
    background:rgba(0,0,0,.75);
    backdrop-filter:blur(12px);
    box-shadow:0 0 40px rgba(255,0,0,.3);
    position:relative;
    z-index:2;
}

.left{
    width:55%;
}

.left img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.right{
    width:45%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    color:white;
    padding:40px;
}

.logo{
    font-size:54px;
    font-weight:bold;
    color:#E50914;
    letter-spacing:3px;
    margin-bottom:20px;
}

.tag{
    color:#d0d0d0;
    margin-bottom:35px;
    text-align:center;
}

input{
    width:240px;
    padding:15px;
    border:none;
    border-radius:8px;
    background:#2b2b2b;
    color:white;
    font-size:20px;
    text-align:center;
    outline:none;
}

button{
    margin-top:20px;
    width:240px;
    padding:15px;
    border:none;
    border-radius:8px;
    background:#E50914;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#ff1f2d;
    transform:scale(1.03);
}
.pin-container{
    display:flex;
    gap:15px;
    margin:25px 0;
}

.pin-box{
    width:60px;
    height:60px;
    border:2px solid #666;
    border-radius:10px;
    background:#2b2b2b;
    color:white;
    font-size:28px;
    text-align:center;
    outline:none;
    transition:.3s;
}

.pin-box:focus{
    border-color:#E50914;
    box-shadow:0 0 10px #E50914;
}

#error{
    color:#ff8c8c;
    margin-top:15px;
    height:20px;
}
/* Shake animation */
@keyframes shake {
    0%   { transform: translateX(0); }
    20%  { transform: translateX(-10px); }
    40%  { transform: translateX(10px); }
    60%  { transform: translateX(-10px); }
    80%  { transform: translateX(10px); }
    100% { transform: translateX(0); }
}

.shake{
    animation: shake 0.4s ease;
}


</style>

</head>

<body>

<div class="heart" style="left:8%;font-size:30px;animation-delay:0s;">❤</div>
<div class="heart" style="left:20%;font-size:20px;animation-delay:2s;">❤</div>
<div class="heart" style="left:35%;font-size:28px;animation-delay:4s;">❤</div>
<div class="heart" style="left:50%;font-size:24px;animation-delay:1s;">❤</div>
<div class="heart" style="left:70%;font-size:35px;animation-delay:3s;">❤</div>
<div class="heart" style="left:88%;font-size:22px;animation-delay:5s;">❤</div>

<div class="card">

<div class="left">
<img src="WhatsApp Image.jpeg" alt="Photo">
</div>

<div class="right">

<div class="logo">FOR THE BIRTHDAY BOY</div>

<p class="tag">
Only one person knows the PIN ❤️
</p>
<div class="pin-container">
    <input type="password" class="pin-box" maxlength="1">
    <input type="password" class="pin-box" maxlength="1">
    <input type="password" class="pin-box" maxlength="1">
    <input type="password" class="pin-box" maxlength="1">
</div>

<button onclick="unlock()">
Unlock
</button>

<p id="error"></p>

</div>

</div>

<script>

const correctPIN = "1807";
let attempts = 3;

const boxes = document.querySelectorAll(".pin-box");
   
// Automatically move to the next box
boxes.forEach((box, index) => {
    box.addEventListener("input",() => {
        if (box.value && index < boxes.length - 1) {
            boxes[index + 1].focus();
        }

        // Pressing the last digit unlocks automatically
        if (index === boxes.length - 1 && box.value) {
            unlock();
        }
    });

    // Backspace goes to the previous box
    box.addEventListener("keydown", (e) => {
        if (e.key === "Backspace" && !box.value && index > 0) {
            boxes[index - 1].focus();
        }

        if (e.key === "Enter") {
            unlock();
        }
    });
});

function unlock() {
    let enteredPIN = "";

    boxes.forEach(box => enteredPIN += box.value);

    if (enteredPIN === correctPIN) {
        window.location.href ="page2.html";
        return;
    }

    attempts--;

    boxes.forEach(box => {
        box.classList.add("shake");
        box.value = "";
    });

    setTimeout(() => {
        boxes.forEach(box => box.classList.remove("shake"));
    }, 400);

    boxes[0].focus();

    if (attempts > 0) {
        document.getElementById("error").innerHTML =
            "❌ Wrong PIN! Attempts left: " + attempts;
    } else {
        document.getElementById("error").innerHTML =
            "🔒 Too many incorrect attempts!";
        boxes.forEach(box => box.disabled = true);
    }
}

</script>

</body>
</html>
